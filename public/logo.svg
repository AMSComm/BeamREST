<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3" />
    </linearGradient>

    <!-- Beam Glow Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Core Energy Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Accent Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#00f2fe" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- macOS App Squircle Container -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Ambient Glow Behind Glyph -->
  <circle cx="512" cy="512" r="320" fill="url(#cyanGlow)" />

  <!-- Abstract Tech Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="200" y1="360" x2="824" y2="360" stroke-dasharray="8 8" />
    <line x1="200" y1="512" x2="824" y2="512" stroke-dasharray="8 8" />
    <line x1="200" y1="664" x2="824" y2="664" stroke-dasharray="8 8" />
    <line x1="360" y1="200" x2="360" y2="824" stroke-dasharray="8 8" />
    <line x1="512" y1="200" x2="512" y2="824" stroke-dasharray="8 8" />
    <line x1="664" y1="200" x2="664" y2="824" stroke-dasharray="8 8" />
  </g>

  <!-- Central API Gateway Capsule / Hexagon -->
  <g filter="url(#shadow)">
    <!-- Outer Gateway Hexagon Path -->
    <path d="M 512 240 L 730 366 L 730 658 L 512 784 L 294 658 L 294 366 Z" 
          fill="#0f172a" 
          stroke="#1e293b" 
          stroke-width="16" />
    
    <!-- Inner Accent Rim -->
    <path d="M 512 270 L 704 381 L 704 643 L 512 754 L 320 643 L 320 381 Z" 
          fill="none" 
          stroke="url(#energyGrad)" 
          stroke-width="6" 
          opacity="0.7" />
  </g>

  <!-- Dynamic Beam Cutting Through the Core -->
  <g>
    <!-- Beam Trail -->
    <path d="M 180 512 L 844 512" stroke="url(#beamGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Secondary Precision Ray -->
    <path d="M 260 480 L 764 480" stroke="#00f2fe" stroke-width="6" opacity="0.4" stroke-linecap="round" />
    <path d="M 260 544 L 764 544" stroke="#00f2fe" stroke-width="6" opacity="0.4" stroke-linecap="round" />
    
    <!-- Central Beam Pulse Particle -->
    <circle cx="512" cy="512" r="32" fill="#ffffff" />
    <circle cx="512" cy="512" r="64" fill="url(#cyanGlow)" />
  </g>

  <!-- HTTP Method & Status Indicator Spheres -->
  <!-- Emerald Green (Success 200 OK) -->
  <circle cx="730" cy="366" r="28" fill="#10b981" stroke="#047857" stroke-width="6" />
  <circle cx="730" cy="366" r="12" fill="#a7f3d0" />

  <!-- Electric Cyan (GET Request Source) -->
  <circle cx="294" cy="366" r="28" fill="#06b6d4" stroke="#0891b2" stroke-width="6" />
  <circle cx="294" cy="366" r="12" fill="#cffafe" />

  <!-- Amber (Token / Script Pulse) -->
  <circle cx="512" cy="784" r="24" fill="#f59e0b" stroke="#d97706" stroke-width="6" />
  <circle cx="512" cy="784" r="10" fill="#fef3c7" />

  <!-- Speed Burst Chevron -->
  <path d="M 640 460 L 710 512 L 640 564" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
