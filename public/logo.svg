<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Solar Flame Gradient (Matches in-app Header badge from-[#ea580c] via-[#f97316] to-[#fbbf24]) -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Top Border Highlight for macOS Glass/Depth feel -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Radial Highlight on Top Half -->
    <radialGradient id="topGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow beneath the Zap Lightning Glyph -->
    <filter id="zapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7c2d12" flood-opacity="0.5" />
    </filter>

    <!-- Outer Squircle Shadow -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- macOS App Squircle Container with Soft Shadow -->
  <g filter="url(#appShadow)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />
    <!-- Top Ambient Highlight -->
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#topGlow)" />
  </g>

  <!-- Centered Iconic Lucide Zap Glyph (Bold, Crisp Pure White with Drop Shadow) -->
  <g filter="url(#zapShadow)" transform="translate(512, 512) scale(26) translate(-12, -12)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" 
             fill="#ffffff" 
             stroke="#ffffff" 
             stroke-width="1.6" 
             stroke-linecap="round" 
             stroke-linejoin="round" />
  </g>
</svg>
