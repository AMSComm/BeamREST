<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Exact In-App Gradient: bg-gradient-to-tr from-[#0ea5e9] to-[#06b6d4] -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- In-App Soft Cyan Shadow: shadow-sm shadow-[#06b6d4]/30 -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle rounded badge (rounded-md proportion: 24% radius) -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bgGrad)" filter="url(#badgeShadow)" />

  <!-- Lucide Zap Glyph: Exactly matching <Zap className="h-3.5 w-3.5 text-white" /> -->
  <!-- Centered at (512, 512), scaled to 528px (matching the 14px / 24px proportion = 58.3%) -->
  <g transform="translate(512, 512) scale(22) translate(-12, -12)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
             fill="none"
             stroke="#ffffff"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round" />
  </g>
</svg>
