<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Cyan/Sky-Blue Gradient (Matches in-app Header badge: bg-gradient-to-tr from-[#0ea5e9] to-[#06b6d4]) -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Top Border Highlight for macOS Glass/Depth feel -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Radial Highlight on Top Half -->
    <radialGradient id="topGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow beneath the Zap Lightning Glyph -->
    <filter id="zapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0369a1" flood-opacity="0.4" />
    </filter>

    <!-- Outer Squircle Shadow (Matching in-app shadow-sm shadow-[#06b6d4]/30) -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- macOS App Squircle Container with Soft Shadow -->
  <g filter="url(#appShadow)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />
    <!-- Top Ambient Highlight -->
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#topGlow)" />
  </g>

  <!-- Centered Iconic Lucide Zap Glyph (Bold, Crisp Pure White with Drop Shadow) -->
  <g filter="url(#zapShadow)" transform="translate(512, 512) scale(26) translate(-12, -12)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" 
             fill="#ffffff" 
             stroke="#ffffff" 
             stroke-width="1.6" 
             stroke-linecap="round" 
             stroke-linejoin="round" />
  </g>
</svg>
